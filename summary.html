<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ed">
  <title>สรุปข้อมูลฟาร์ม — โคดี</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .summary-page{max-width:1160px;margin:0 auto;padding:48px 24px 72px}.summary-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.summary-heading h1{margin:5px 0;font-size:32px}.summary-heading p,.summary-status{color:var(--muted)}.summary-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.summary-card,.summary-table-card,.profile-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.summary-card span{display:block;color:var(--muted);font-size:13px}.summary-card strong{display:block;margin-top:8px;color:var(--green);font-size:30px}.summary-table-card h2,.profile-card h2{margin:0 0 14px;font-size:20px}.summary-table-wrap{overflow:auto}.summary-table{width:100%;border-collapse:collapse;min-width:720px}.summary-table th,.summary-table td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.summary-table th{background:#f0f4eb;color:var(--green);font-weight:600}.summary-table td small{display:block;color:var(--muted);margin-top:3px}.summary-empty{padding:30px;text-align:center;color:var(--muted);background:#f7f8f3;border-radius:12px}.summary-status{font-size:13px}.summary-status.error{color:#9d4a35}.summary-setup{margin-top:15px;padding:14px 16px;background:#fff4de;border-radius:12px;color:#805c21;font-size:13px}.profile-card{margin-bottom:20px;display:flex;align-items:center;gap:13px}.profile-card p{color:var(--muted);margin:0}.profile-icon{width:42px;height:42px;flex:none;border-radius:13px;background:#e9f0e2;color:var(--green);display:grid;place-items:center;font-size:20px}.profile-card h2{font-size:16px;margin:0 0 3px}
    @media(max-width:700px){.summary-page{padding:28px 16px 48px}.summary-heading{align-items:start;flex-direction:column}.summary-heading h1{font-size:27px}.summary-cards{grid-template-columns:1fr;gap:10px}.summary-card{padding:16px}.summary-card strong{font-size:25px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">🐄</span><span>โค<span class="brand-accent">ดี</span><small>เครื่องมือดูแลโคเนื้อ</small></span></a>
    <nav class="nav" aria-label="เมนูหลัก"><a href="index.html">ประเมิน BCS</a><a href="calculator.html">คำนวณอาหาร</a><a class="active" href="summary.html">สรุปข้อมูล</a><a href="guide.html">คู่มือ</a></nav>
    <a class="top-cta" href="calculator.html">บันทึกอาหาร <span>↗</span></a>
  </header>
  <main class="summary-page">
    <div class="summary-heading"><div><span class="eyebrow">FARM RECORDS</span><h1>สรุปข้อมูลฟาร์ม</h1><p>ภาพรวมรายการคำนวณอาหารที่บันทึกไว้</p></div><span class="summary-status" id="summary-status" role="status">กำลังโหลดข้อมูล…</span></div>
    <section class="summary-cards" aria-label="ภาพรวม">
      <article class="summary-card"><span>รายการบันทึก</span><strong id="record-count">—</strong></article>
      <article class="summary-card"><span>ปริมาณอาหารสดรวม</span><strong id="feed-total">—</strong></article>
      <article class="summary-card"><span>BCS เฉลี่ย</span><strong id="bcs-average">—</strong></article>
    </section>
    <section class="summary-table-card">
      <h2>รายการล่าสุด</h2>
      <div class="summary-table-wrap" id="summary-content"><p class="summary-empty">กำลังอ่านข้อมูล…</p></div>
      <p class="summary-setup" id="summary-setup" hidden></p>
    </section>
  </main>
  <script type="module" src="summary.js"></script>
</body>
</html>
